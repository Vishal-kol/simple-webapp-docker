name: Deploy to docker
on :
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name:   Checkout code
        uses:  actions/checkout@v2

      - name: Caching
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache
          key: ${{ runner.os }}-cache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cache-

      - name: Build docker image with cache
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/my-app:cache || true
          docker build \
          --cache-from=${{ secrets.DOCKER_USERNAME }}/my-app:cache \
          -t ${{ secrets.DOCKER_USERNAME }}/my-app:latest .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/my-app:latest

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2


        with:
          args: >
            -Dsonar.projectKey=my-app
            -Dsonar.sources=.
            -Dsonar.python.coverage.reportPaths=coverage.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://172.160.226.3:9000
      - name: SonarQube gate check
        uses: sonarsource/sonarqube-quality-gate-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://172.160.226.3:9000 

      - name:   Login to Docker Hub
        uses:  docker/login-action@v1
        with:
          username:  ${{ secrets.DOCKER_USERNAME }}
          password:  ${{ secrets.DOCKER_PASSWORD }}
      
      - name:  Push docker image
        run:  docker push ${{ secrets.DOCKER_USERNAME }}/my-app:latest
      
      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no azureuser@172.160.226.3 \
            "sudo docker pull ${{ secrets.DOCKER_USERNAME }}/my-app:latest && \
             sudo docker stop my-app || true && \
             sudo docker rm my-app || true && \
             sudo docker run -d --name my-app -p 80:80 ${{ secrets.DOCKER_USERNAME }}/my-app:latest"
